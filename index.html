<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Nail Rescue: Nail Salon Makeover</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="ui-kit/ui.css">
<link rel="stylesheet" href="ui-kit/skin.css">
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<!-- Everything the player sees lives in #app; the shell locks #app (never <body>) while YouTube pauses the game. -->
<main id="app" aria-label="Nail Salon">
  <canvas id="stage" aria-label="Salon table"></canvas>
  <div id="ui">
    <section id="play" class="screen screen--play">
      <div class="hud-top">
        <!-- the only control on the play screen: Next, shown when the step (or the whole makeover) is done -->
        <!-- progress of the current step, no words -->
        <div class="goal hud-goal step-goal" data-hud style="--v:0"><div class="ribbon"><div class="ribbon__fill" id="stepbar"></div><span class="ribbon__heart" aria-hidden="true"><svg viewBox="-12 -12 24 22"><path d="M0 8 C-15 -3 -9 -15 0 -8 C9 -15 15 -3 0 8z"/></svg></span><span class="ribbon__burst" id="ribbon-burst" aria-hidden="true"></span></div></div>
        <div class="hud-menu" data-hud><button class="btn btn--primary btn--icon hud-next" id="next-step" aria-label="Next" hidden><svg class="icon"><use href="#i-next"/></svg></button></div>
      </div>
      <div class="playfield" id="playfield">
        <div class="board-box" id="boardBox"></div>
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
      </div>
      <div class="dock-move" data-hud>
        <div class="tray-rows" id="tray"></div>
      </div>
      <div class="dock-act" data-hud></div>
    </section>
    <div class="tut" id="tut" hidden aria-hidden="true"><svg class="icon"><use href="#i-arrow-down"/></svg></div>

    <!-- MENU (also the shell's settings dialog: #settings, #vol-music, #vol-sfx, #close-settings) -->
    <div class="modal" id="settings" hidden>
      <div class="panel panel--small" role="dialog" aria-labelledby="pauseTitle">
        <div class="panel__head">
          <h2 class="panel__title" id="pauseTitle" data-t="paused">Paused</h2>
          <button class="btn btn--icon" id="menu-x" aria-label="Close"><svg class="icon"><use href="#i-close"/></svg></button>
        </div>
        <div class="panel__body">
          <label class="row"><svg class="icon"><use href="#i-sound"/></svg><span class="row__label" data-t="sfx">Sound effects</span><input class="switch" type="checkbox" id="vol-sfx"></label>
          <label class="row"><svg class="icon"><use href="#i-music"/></svg><span class="row__label" data-t="music">Music</span><input class="switch" type="checkbox" id="vol-music"></label>
          <p class="caption" data-t="credits">UI art: Kenney (kenney.nl) · Fonts: Fredoka, Nunito (OFL)</p>
        </div>
        <div class="panel__foot"><button class="btn btn--primary" id="close-settings"><svg class="icon"><use href="#i-play"/></svg><span data-t="resume">Resume</span></button></div>
      </div>
    </div>

  </div>
</main>

<div id="loading" role="status" aria-label="Loading" style="--p:0">
  <!-- The nail fills up: one big nail paints itself from the cuticle up as the game loads (the fill is the progress) -->
  <div class="ld-title">Nail Rescue</div>
  <svg class="ld-art" viewBox="0 0 180 300" aria-hidden="true">
    <defs><clipPath id="ld-clip"><path d="M60 250 L60 130 C60 80 75 62 90 56 C105 62 120 80 120 130 L120 250 Q90 262 60 250Z"/></clipPath>
      <linearGradient id="ld-polish" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#e8197c"/><stop offset="1" stop-color="#ff5fb4"/></linearGradient></defs>
    <rect x="50" y="196" width="80" height="104" rx="40" fill="#e8b996" stroke="#b5835f" stroke-width="2.4"/>
    <path d="M60 250 L60 130 C60 80 75 62 90 56 C105 62 120 80 120 130 L120 250 Q90 262 60 250Z" fill="#fde4ec" stroke="#3d3f55" stroke-width="2.6"/>
    <g clip-path="url(#ld-clip)"><rect class="ld-fill" x="40" y="56" width="100" height="210" fill="url(#ld-polish)"/>
      <rect x="69" y="72" width="8" height="160" rx="4" fill="#ffffff" opacity=".45"/></g>
    <g class="ld-spark"><path d="M90 30 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5z" fill="#ffffff"/><path d="M140 110 l3.5 8 8 3.5 -8 3.5 -3.5 8 -3.5 -8 -8 -3.5 8 -3.5z" fill="#fff6b0"/><path d="M38 160 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z" fill="#ffffff"/></g>
  </svg>
  <div class="ld-pct" id="loading-pct">0%</div>
  <div id="loading-bar" hidden></div>
</div>

<!-- INT-1: the Playables SDK is the first script, with only src. Relative paths only after it. -->
<script src="js/fake-ytgame.js"></script><!-- PREVIEW ONLY: local stand-in for the YouTube SDK -->
<script src="js/ytplayables-bridge.js"></script>
<script src="js/shell.js"></script>
<script src="js/game.js"></script>
</body>
</html>
